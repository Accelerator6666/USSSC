name: Build, Test & Package

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: usssc-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run tests
        run: npm test

      - name: Build extension
        run: npm run build

      - name: Validate package versions
        shell: bash
        run: |
          set -euo pipefail
          ROOT_VERSION="$(node -p "require('./package.json').version")"
          EXT_VERSION="$(node -p "require('./apps/extension/package.json').version")"
          MANIFEST_VERSION="$(node -p "require('./apps/extension/dist/manifest.json').version")"

          echo "root=$ROOT_VERSION"
          echo "extension=$EXT_VERSION"
          echo "manifest=$MANIFEST_VERSION"

          test "$ROOT_VERSION" = "$EXT_VERSION"
          test "$ROOT_VERSION" = "$MANIFEST_VERSION"

          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            test "$TAG_VERSION" = "$ROOT_VERSION"
          fi

      - name: Validate extension output
        shell: bash
        run: |
          set -euo pipefail
          test -f apps/extension/dist/manifest.json
          test -f apps/extension/dist/popup.html
          test -f apps/extension/dist/background.js

      - name: Create installable ZIP
        id: package
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          FILE="USSSC-v${VERSION}.zip"
          (
            cd apps/extension/dist
            zip -r "../../../${FILE}" .
          )
          sha256sum "$FILE" | tee "${FILE}.sha256"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "file=$FILE" >> "$GITHUB_OUTPUT"

      - name: Upload packaged extension
        uses: actions/upload-artifact@v7
        with:
          name: USSSC-v${{ steps.package.outputs.version }}
          path: |
            ${{ steps.package.outputs.file }}
            ${{ steps.package.outputs.file }}.sha256
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download packaged extension
        uses: actions/download-artifact@v7
        with:
          name: USSSC-${{ github.ref_name }}
          path: release-assets

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          ZIP="release-assets/USSSC-${GITHUB_REF_NAME}.zip"
          SHA="${ZIP}.sha256"
          test -f "$ZIP"
          test -f "$SHA"

          if gh release view "$GITHUB_REF_NAME" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$ZIP" "$SHA" --clobber --repo "$GH_REPO"
          else
            gh release create "$GITHUB_REF_NAME" \
              "$ZIP" "$SHA" \
              --repo "$GH_REPO" \
              --title "USSSC ${GITHUB_REF_NAME}" \
              --generate-notes
          fi
